
    {% extends "Home.html" %}

{% block content %}
    <h2 class="heading">{{operation}}  Product</h2>
    <form id="frm" name="frm" method="post" action="/ProcessProductOperation" enctype="multipart/form-data">
               
      
         <input type="hidden" name="operation" value="{{ operation }}"/>
         <input type="hidden" name="productID" value="{{ row.productID }}"/>

        

                                            <div class="form-group row">
                                    <label for="productName" class="col-sm-3 col-form-label">Productname </label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="productName" id="productName"  value="{{ row.productName }}" required {{'readonly' if operation == 'Delete'}} />
                                    </div>
                                </div>
                                            
                                            <div class="form-group row">
                                    <label for="packageSize" class="col-sm-3 col-form-label">Packagesize </label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="packageSize" id="packageSize"  value="{{ row.packageSize }}" required {{'readonly' if operation == 'Delete'}} />
                                    </div>
                                </div>
                                            
                    <div class="form-group row">
            <label for="price" class="col-sm-3 col-form-label">Price </label>
            <div class="col-sm-9">
                <input type="number" class="form-control" name="price" id="price"  value="{{ row.price }}" required {{'readonly' if operation == 'Delete'}} />
            </div>
        </div>
                    
    
		
        <div class="text-center">
                <button type="submit" class="btn btn-outline-primary btn-sm ">{{operation}}</button>
                <a href="/ProductListing" class="btn btn-outline-primary btn-sm ">Cancel</a>
        </div>

    </form>
    
{% endblock %}
