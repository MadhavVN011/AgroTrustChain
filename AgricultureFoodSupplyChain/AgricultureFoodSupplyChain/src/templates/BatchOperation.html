{% extends "Home.html" %}

{% block content %}
<h2 class="heading">Register Batch</h2>
<form method="post" action="/ProcessBatchOperation">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-group row">
        <label for="farmerID" class="col-sm-3 col-form-label">Farmer</label>
        <div class="col-sm-9">
            <select class="form-control" id="farmerID" name="farmerID" required>
                {% for dd_row in farmer_list %}<option value="{{ dd_row.farmerID }}">{{ dd_row.farmerName }}</option>{% endfor %}
            </select>
        </div>
    </div>
    <div class="form-group row">
        <label for="productID" class="col-sm-3 col-form-label">Product</label>
        <div class="col-sm-9">
            <select class="form-control" id="productID" name="productID">
                {% for dd_row in product_list %}<option value="{{ dd_row.productID }}">{{ dd_row.productName }}</option>{% endfor %}
            </select>
        </div>
    </div>
    <div class="form-group row">
        <label for="certificateNumber" class="col-sm-3 col-form-label">Certificate number</label>
        <div class="col-sm-9">
            <input type="text" class="form-control" id="certificateNumber" name="certificateNumber" maxlength="200" required/>
            <small class="text-muted">Its SHA-256 hash is stored on-chain and checked against the revocation list.</small>
        </div>
    </div>
    <div class="form-group row">
        <label for="certificateExpiry" class="col-sm-3 col-form-label">Certificate expiry</label>
        <div class="col-sm-9"><input type="date" class="form-control" id="certificateExpiry" name="certificateExpiry" min="{{ today }}" required/></div>
    </div>
    <div class="form-group row">
        <label for="claimedQuality" class="col-sm-3 col-form-label">Claimed quality (0–100)</label>
        <div class="col-sm-9"><input type="number" class="form-control" id="claimedQuality" name="claimedQuality" min="0" max="100" step="1" required/></div>
    </div>
    <div class="text-center">
        <button type="submit" class="btn btn-outline-primary btn-sm">Register</button>
        <a href="/BatchListing" class="btn btn-outline-primary btn-sm">Cancel</a>
    </div>
</form>
{% endblock %}
