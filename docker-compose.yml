# AgroTrustChain: full local stack.
#
#   docker compose up --build      then open http://localhost:5000
#
# Services:
#   db         SQL Server 2022 (Developer edition)
#   db-init    one-shot: restores the .bak on first start, then runs migrate.sql
#   ganache    private Ethereum chain (network id 5777, deterministic accounts)
#   contracts  one-shot: `truffle migrate` against ganache
#   app        the Flask web app
#
# Every setting below can be overridden in a .env file (see .env.example).
# `docker compose down -v` deletes the database and chain to start over.

name: agrotrustchain

x-db-env: &db-env
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AgroTrust_Dev_2026!}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      <<: *db-env
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./AgricultureFoodSupplyChain/AgricultureFoodSupplyChainV1DB.bak:/backup/AgricultureFoodSupplyChainV1DB.bak:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      DB_HOST: db
    volumes:
      - ./docker/db/init.sh:/scripts/init.sh:ro
      - ./AgricultureFoodSupplyChain/migrate.sql:/scripts/migrate.sql:ro
    entrypoint: ["bash", "/scripts/init.sh"]
    restart: "no"

  ganache:
    image: trufflesuite/ganache:v7.9.2
    command:
      - --server.host=0.0.0.0
      - --server.port=7545
      - --chain.networkId=5777
      - --chain.chainId=1337
      - --wallet.deterministic=true
      - --database.dbPath=/data
    ports:
      - "127.0.0.1:${GANACHE_PORT:-7545}:7545"
    volumes:
      - ganache-data:/data

  contracts:
    build:
      context: .
      dockerfile: docker/contracts/Dockerfile
    depends_on:
      - ganache
    environment:
      GANACHE_HOST: ganache
      GANACHE_PORT: "7545"
      CONTRACTS_BUILD_DIR: /contracts-build
    volumes:
      - contracts-build:/contracts-build
    restart: "no"

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
      contracts:
        condition: service_completed_successfully
    environment:
      DB_SERVER: db
      DB_NAME: AgricultureFoodSupplyChainV1
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-AgroTrust_Dev_2026!}
      ETH_RPC_URL: http://ganache:7545
      CONTRACTS_BUILD_DIR: /contracts-build
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      - contracts-build:/contracts-build:ro

volumes:
  mssql-data:
  ganache-data:
  contracts-build:
