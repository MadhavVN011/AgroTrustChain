name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run pytest in the app's test image
        run: docker compose --profile test run --rm tests

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Truffle tests against Ganache
        run: docker compose run --rm contracts truffle test --network development
      - name: Stop Ganache
        if: always()
        run: docker compose down -v

  integration:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (SQL Server, Ganache, contracts, app)
        run: docker compose up -d --build
      - name: Smoke test
        run: bash docker/smoke-test.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  demo:
    name: Build Vercel demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2
      - run: python demo/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo/dist
          if-no-files-found: error

  # Pull requests: automatic preview deployment.
  deploy-preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: [python-tests, contract-tests, integration, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: demo/dist
      - name: Deploy
        run: bash .github/scripts/vercel-deploy.sh preview

  # main: production deployment, held until a reviewer approves it in the
  # "production" environment (Settings > Environments). Only main may deploy.
  deploy-production:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python-tests, contract-tests, integration, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://agrotrustchain.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: demo/dist
      - name: Deploy
        run: bash .github/scripts/vercel-deploy.sh production
