name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run pytest in the app's test image
        run: docker compose --profile test run --rm tests

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Truffle tests against Ganache
        run: docker compose run --rm contracts truffle test --network development
      - name: Stop Ganache
        if: always()
        run: docker compose down -v

  integration:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (SQL Server, Ganache, contracts, app)
        run: docker compose up -d --build
      - name: Smoke test
        run: bash docker/smoke-test.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  simulation:
    name: WTH-Raft simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r simulation/requirements.txt pytest
      - name: Simulation tests
        run: python -m pytest -q -p no:cacheprovider simulation/tests
      - name: Quick simulation run
        run: python simulation/run.py --quick --out "$RUNNER_TEMP/simulation"
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-quick-results
          path: ${{ runner.temp }}/simulation

  demo:
    name: Build Vercel demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2
      - run: python demo/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo/dist
          if-no-files-found: error
