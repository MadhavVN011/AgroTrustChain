name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run pytest in the app's test image
        run: docker compose --profile test run --rm tests

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Truffle tests against Ganache
        run: docker compose run --rm contracts truffle test --network development
      - name: Stop Ganache
        if: always()
        run: docker compose down -v

  integration:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (SQL Server, Ganache, contracts, app)
        run: docker compose up -d --build
      - name: Smoke test
        run: bash docker/smoke-test.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  demo:
    name: Build Vercel demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2
      - run: python demo/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo/dist
          if-no-files-found: error

  deploy:
    name: Deploy demo to Vercel
    needs: [python-tests, contract-tests, integration, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pull requests get a preview; main gets production. Skipped when the
    # Vercel secrets are not available (e.g. pull requests from forks).
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Vercel secrets are not set; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: demo-site
          path: demo/dist
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            target="--prod"; label="Production"
          else
            target=""; label="Preview"
          fi
          url=$(npx --yes vercel@latest deploy demo/dist $target --yes --token "$VERCEL_TOKEN")
          echo "$label deployment: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$label deployment: $url"
